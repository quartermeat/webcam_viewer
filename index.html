<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Interface</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <main class="app">
    <header>
      <span id="status" class="status">Camera off</span>
    </header>

    <section id="stage" class="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <div class="hud" aria-live="polite">
        <div class="mode-panel"><span>MUSIC CONTROL</span><strong id="controlState">OBSERVE</strong><i id="activationMeter"></i></div>
        <div><span>SYSTEM</span><strong id="modelState">Loading vision…</strong></div>
        <div><span>GESTURE</span><strong id="gestureState">—</strong></div>
        <div><span>CONFIDENCE</span><strong id="confidenceState">—</strong></div>
        <div><span>CAMERA</span><strong id="cameraState">—</strong></div>
        <div><span>VISION FPS</span><strong id="fpsState">0</strong></div>
      </div>
      <section class="transcript-panel" aria-label="Voice transcription" aria-live="polite">
        <div class="transcript-heading">
          <span>VOICE // TRANSCRIPT</span>
          <i id="transcriptState">STANDBY</i>
        </div>
        <p id="transcriptText">Awaiting voice input…</p>
      </section>
      <section class="now-playing" aria-label="Now playing" aria-live="polite">
        <div class="sound-mark" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="track-copy">
          <span>NOW PLAYING // <b id="playerName">LISTENING</b></span>
          <strong id="trackTitle">No signal</strong>
          <p id="trackArtist">Waiting for media…</p>
        </div>
        <img id="albumArt" alt="" hidden>
      </section>
      <aside class="input-legend" aria-label="Available controls">
        <span><kbd>PALM</kbd> MUSIC</span>
        <span><kbd>PINCH</kbd> SELECT</span>
        <span><kbd>SCROLL LOCK</kbd> SPEAK</span>
      </aside>
      <div id="gestureCursor" aria-hidden="true"></div>
      <div id="emptyState" class="empty-state">
        <div class="lens" aria-hidden="true"></div>
        <p>Initialize the interface to begin.</p>
      </div>
    </section>

    <section class="controls" aria-label="Interface controls">
      <label>
        <span>Camera</span>
        <select id="cameraSelect" aria-label="Camera"></select>
      </label>
      <button id="startButton" class="primary">Initialize interface</button>
      <button id="mirrorButton" aria-pressed="true">Mirror: on</button>
      <button id="fullscreenButton">Enter interface</button>
    </section>

  </main>
  <script type="module" src="app.js?v=5"></script>
</body>
</html>
