<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Human Interface camera</title>
<style>
  html,body { margin:0; width:100%; height:100%; background:#020708; color:#9fffdc; font:16px system-ui; }
  main { display:grid; place-items:center; gap:1rem; min-height:100%; padding:1rem; box-sizing:border-box; }
  video { width:min(100%, 720px); max-height:78vh; object-fit:contain; background:#000; border:1px solid #287d68; border-radius:12px; }
  button { border:1px solid #48cba6; border-radius:8px; background:#12352e; color:#d8fff1; padding:.8rem 1rem; font:inherit; }
  #state { opacity:.8; }
</style>
<main>
  <h1>Human Interface camera</h1>
  <video id="preview" autoplay playsinline muted></video>
  <video id="processed" autoplay playsinline muted hidden></video>
  <div>
    <button id="start">Connect camera</button>
    <button id="switch" disabled>Switch to back camera</button>
    <button id="view" disabled>Show camera view</button>
  </div>
  <div id="state">Waiting for Linux viewer…</div>
</main>
<script type="module">
const preview = document.querySelector('#preview');
const processed = document.querySelector('#processed');
const button = document.querySelector('#start');
const switchButton = document.querySelector('#switch');
const viewButton = document.querySelector('#view');
const state = document.querySelector('#state');
const poolButton = document.createElement('button');
poolButton.textContent = 'Calibrate table on phone'; poolButton.disabled = true;
document.querySelector('main > div').append(poolButton);
let camera, peer, previewPeer, answerSeen = '', previewAnswerSeen = '';
let facingMode = 'user';
let calibrationArmed = false, calibrationPoints = [];
let showingProcessed = true;
async function openCamera(mode, exact = false) {
  const facing = exact ? { exact: mode } : { ideal: mode };
  try {
    return await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30} }, audio:false });
  } catch (error) {
    if (exact && error.name === 'OverconstrainedError') {
      return navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:mode}, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30} }, audio:false });
    }
    throw error;
  }
}
const waitIce = pc => pc.iceGatheringState === 'complete' ? Promise.resolve() : new Promise(resolve => {
  const finish = () => { clearTimeout(timeout); resolve(); };
  const timeout = setTimeout(finish, 2500);
  pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && finish(), { once:true });
});
async function connect() {
  button.disabled = true;
  state.textContent = 'Requesting camera…';
  // 720p keeps the uplink and Linux-side vision pipeline responsive on LAN.
  camera = await openCamera(facingMode);
  preview.srcObject = camera;
  peer = new RTCPeerConnection({ iceServers:[] });
  camera.getTracks().forEach(track => { track.contentHint = 'motion'; peer.addTrack(track, camera); });
  const offer = await peer.createOffer();
  await peer.setLocalDescription(offer);
  state.textContent = 'Gathering local connection…';
  await waitIce(peer);
  const response = await fetch('/api/phone/offer', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sdp:peer.localDescription.sdp}) });
  if (!response.ok) throw new Error('Linux bridge rejected camera offer');
  state.textContent = 'Camera connected; waiting for viewer answer…';
  switchButton.disabled = false;
  const poll = async () => {
    if (!peer) return;
    const response = await fetch('/api/phone/answer?t='+Date.now(), {cache:'no-store'});
    const payload = await response.json();
    if (payload.sdp && payload.sdp !== answerSeen) {
      answerSeen = payload.sdp;
      await peer.setRemoteDescription({type:'answer', sdp:payload.sdp});
  state.textContent = 'Sending camera to Linux';
      connectPreview();
      return;
    }
    setTimeout(poll, 700);
  };
  poll();
}
async function switchCamera() {
  if (!peer || !camera) return;
  switchButton.disabled = true;
  const nextMode = facingMode === 'user' ? 'environment' : 'user';
  try {
    const next = await openCamera(nextMode, true);
    const nextTrack = next.getVideoTracks()[0];
    const sender = peer.getSenders().find(item => item.track?.kind === 'video');
    if (!sender) throw new Error('Camera video sender is unavailable');
    await sender.replaceTrack(nextTrack);
    camera.getTracks().forEach(track => track.stop());
    camera = next;
    preview.srcObject = camera;
    facingMode = nextTrack.getSettings().facingMode || nextMode;
    switchButton.textContent = facingMode === 'user' ? 'Switch to back camera' : 'Switch to front camera';
    state.textContent = facingMode === 'user' ? 'Front camera active' : 'Back camera active';
  } catch (error) {
    state.textContent = 'Camera switch failed: ' + error.message;
  } finally {
    switchButton.disabled = false;
  }
}
async function connectPreview() {
  previewPeer = new RTCPeerConnection({ iceServers:[] });
  previewPeer.ontrack = event => {
    const output = processed;
    const stream = event.streams[0] || new MediaStream([event.track]);
    output.hidden = false; preview.hidden = true; output.srcObject = stream;
    output.play().catch(() => {}); poolButton.disabled = false; viewButton.disabled = false;
    showingProcessed = true; viewButton.textContent = 'Show camera view'; state.textContent = 'Processed preview connected';
  };
  previewPeer.addTransceiver('video', { direction:'recvonly' });
  const offer = await previewPeer.createOffer();
  await previewPeer.setLocalDescription(offer); await waitIce(previewPeer);
  await fetch('/api/phone/preview-offer', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sdp:previewPeer.localDescription.sdp}) });
  const poll = async () => {
    if (!previewPeer) return;
    const payload = await (await fetch('/api/phone/preview-answer?t='+Date.now(), {cache:'no-store'})).json();
    if (payload.sdp && payload.sdp !== previewAnswerSeen) { previewAnswerSeen=payload.sdp; await previewPeer.setRemoteDescription({type:'answer',sdp:payload.sdp}); return; }
    setTimeout(poll,700);
  };
  poll();
}
button.addEventListener('click', () => connect().catch(error => { button.disabled=false; state.textContent='Camera error: '+error.message; }));
switchButton.addEventListener('click', () => switchCamera());
viewButton.addEventListener('click', () => {
  showingProcessed = !showingProcessed;
  processed.hidden = !showingProcessed;
  preview.hidden = showingProcessed;
  viewButton.textContent = showingProcessed ? 'Show camera view' : 'Show processed view';
  state.textContent = showingProcessed ? 'Processed preview' : (facingMode === 'user' ? 'Front camera view' : 'Back camera view');
});
poolButton.addEventListener('click', () => {
  calibrationArmed = true; calibrationPoints = [];
  poolButton.textContent = 'Tap 4 corners on table…';
  state.textContent = 'Tap table corners clockwise, starting top-left';
});
processed.addEventListener('click', async event => {
  if (!calibrationArmed || calibrationPoints.length >= 4 || !processed.videoWidth) return;
  const rect = processed.getBoundingClientRect();
  const scale = Math.min(rect.width / processed.videoWidth, rect.height / processed.videoHeight);
  const left = rect.left + (rect.width - processed.videoWidth * scale) / 2;
  const top = rect.top + (rect.height - processed.videoHeight * scale) / 2;
  calibrationPoints.push({
    x: Math.max(0, Math.min(1, (event.clientX - left) / (processed.videoWidth * scale))),
    y: Math.max(0, Math.min(1, (event.clientY - top) / (processed.videoHeight * scale))),
  });
  state.textContent = `Table corner ${calibrationPoints.length} of 4`;
  if (calibrationPoints.length === 4) {
    calibrationArmed = false; poolButton.textContent = 'Recalibrate table';
    await fetch('/api/pool/calibration', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ points:calibrationPoints }) });
    state.textContent = 'Table calibrated on Linux viewer';
  }
});
</script>
